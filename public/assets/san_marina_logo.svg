<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" preserveAspectRatio="xMinYMid meet">
  <defs>
    <style>
      .serif-font { font-family: 'Times New Roman', Times, serif; font-weight: 700; }
      .sans-font { font-family: Arial, Helvetica, sans-serif; font-weight: 700; }
      .tagline-font { font-family: Arial, Helvetica, sans-serif; font-weight: 500; }
    </style>
  </defs>

  <!-- Logo Symbol Group -->
  <!-- Generous padding so nothing clips -->
  <g transform="translate(60, 40)">
    <!-- Red Abstract Figure (complete) -->
    <!-- Left red arc -->
    <path d="M60 170 C 40 110, 40 60, 130 45 C 115 70, 100 140, 95 175 Z" fill="#DC2626"/>
    <!-- Right red arc -->
    <path d="M185 170 C 205 110, 205 60, 115 45 C 130 70, 145 140, 150 175 Z" fill="#DC2626"/>

    <!-- Head -->
    <circle cx="120" cy="42" r="12" fill="#DC2626"/>

    <!-- Blue supportive swoosh -->
    <path d="M30 200 Q 120 245 210 200 L 195 215 Q 120 260 45 215 Z" fill="#0056b3"/>

    <!-- Graduation Cap -->
    <path d="M88 28 L 120 14 L 152 28 L 120 42 Z" fill="#001F3F"/>
    <!-- Tassel -->
    <path d="M150 28 L 150 52" stroke="#001F3F" stroke-width="2"/>
  </g>

  <!-- Text Group -->
  <!-- Placed with ample spacing to the right -->
  <g transform="translate(330, 0)">
    <!-- SAN MARINA -->
    <text x="0" y="150" class="serif-font" font-size="120" fill="#DC2626" letter-spacing="1.5">SAN MARINA</text>

    <!-- EDUCATION CONSULTANCY -->
    <text x="4" y="210" class="sans-font" font-size="48" fill="#0056b3" letter-spacing="3">EDUCATION CONSULTANCY</text>

    <!-- Tagline -->
    <text x="4" y="250" class="tagline-font" font-size="30" fill="#4B5563" letter-spacing="1">Study Abroad | Test Preparation | Admission Guidance</text>
  </g>
</svg>
